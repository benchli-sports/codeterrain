[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeterrain-typescript"
version = "0.1.1"
description = "TypeScript and JavaScript for codeterrain: front-end HTTP calls read with tree-sitter."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Mitbolas GmbH" }]
# Exact pins: tree-sitter and its grammars version separately and rename nodes between
# releases, and the pack's version is what keys its cached facts.
dependencies = [
    "codeterrain>=0.3",
    "tree-sitter==0.26.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-javascript==0.25.0",
]

[project.entry-points."codeterrain.languages"]
typescript = "codeterrain_typescript:language"

[project.urls]
Homepage = "https://github.com/benchli-sports/codeterrain"
Issues = "https://github.com/benchli-sports/codeterrain/issues"

[tool.uv.sources]
codeterrain = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/codeterrain_typescript"]
