<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' role="img">
<title>Accuracy against the framework's own answer</title>
<desc>Setup order equal to pytest --setup-plan: 11 of 11 nodes; Routes joined to the access manifest: every route; Calls matched to a route, large backend: 97%; Calls matched to a route, smaller service: 96%; Calls found by refs, against grep, monorepo: 99%</desc>
