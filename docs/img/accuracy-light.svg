<text x="485.0" y="254.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle">50%</text>
<line x1="562.5" y1="74.0" x2="562.5" y2="240.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="562.5" y="254.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle">75%</text>
<line x1="640.0" y1="74.0" x2="640.0" y2="240.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="640.0" y="254.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle">100%</text>
<text x="24.0" y="87.0" fill="#0b0b0b" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle">Setup order equal to pytest --setup-plan</text>
