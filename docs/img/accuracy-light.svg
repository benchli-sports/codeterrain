<text x="646.0" y="121.0" fill="#0b0b0b" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="middle">every route</text>
<text x="24.0" y="155.0" fill="#0b0b0b" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle">Calls matched to a route, large backend</text>
