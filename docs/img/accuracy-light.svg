<text x="24.0" y="52.0" fill="#52514e" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle">Each figure checked against pytest, the access manifest, or by hand. Higher is better.</text>
<line x1="330.0" y1="74.0" x2="330.0" y2="240.0" stroke="#c3c2b7" stroke-width="1"/>
