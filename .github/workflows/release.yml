name: release

# A tag `vX.Y.Z` builds the core and both packs and publishes them to PyPI through trusted
# publishing: no token is stored. Each package publishes from its own environment, which is
# what PyPI's trusted publisher for that package names. A pack whose version is already on PyPI
# is skipped, so a core release does not need a pack release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: the tag is the core's version
        run: |
          version=$(uv run --no-project --python 3.12 python -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME"
      - run: uv build --python 3.12 --out-dir dist/core .
      - run: uv build --python 3.12 --out-dir dist/terraform packages/codeterrain-terraform
      - run: uv build --python 3.12 --out-dir dist/typescript packages/codeterrain-typescript
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include:
          - package: core
            environment: pypi
          - package: terraform
            environment: pypi-terraform
          - package: typescript
            environment: pypi-typescript
    name: publish ${{ matrix.package }}
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/${{ matrix.package }}/
          skip-existing: ${{ matrix.package != 'core' }}
