name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv run --locked --python 3.12 --extra dev ruff check .

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12"]
        fastapi: ["<0.137", ">=0.137"]
        pytest: ["8.*", "9.*"]
        include:
          - os: windows-latest
            python: "3.12"
            fastapi: ">=0.137"
            pytest: "9.*"
    name: ${{ matrix.os }} py${{ matrix.python }} fastapi${{ matrix.fastapi }} pytest${{ matrix.pytest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: install
        # Everything from uv.lock; only the two matrix axes are then moved to the cell's range.
        run: |
          uv sync --locked --extra dev --python ${{ matrix.python }}
          uv pip install "fastapi${{ matrix.fastapi }}" "pytest==${{ matrix.pytest }}"
      - name: versions
        run: uv run --no-sync python -c "import fastapi, pytest; print(fastapi.__version__, pytest.__version__)"
      - run: uv run --no-sync pytest
